services:
  db:
    image: postgres:16-alpine
    container_name: pantrypilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pantrypilot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pantrypilot}
      POSTGRES_DB: ${POSTGRES_DB:-pantrypilot}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
